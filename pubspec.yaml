name: mentor_policial
description: "Taticum — ciclo básico de estudos para carreiras policiais (Windows e macOS)."
publish_to: 'none'
version: 0.6.0+8

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/content/
    - assets/content/constitucional_principios/
    - assets/content/constitucional_principios_aprofundado/
    - assets/content/contabilidade_conceitos/
    - assets/content/contabilidade_conceitos_aprofundado/
    - assets/content/informatica_virus/
    - assets/content/informatica_virus_aprofundado/
    - assets/content/portugues_acentuacao/
    - assets/content/portugues_acentuacao_aprofundado/
    - assets/content/portugues_classes1/
    - assets/content/portugues_classes1_aprofundado/
    - assets/content/portugues_conectivos/
    - assets/content/portugues_conectivos_aprofundado/
    - assets/content/portugues_coordenadas/
    - assets/content/portugues_coordenadas_aprofundado/
    - assets/content/portugues_interpretacao/
    - assets/content/portugues_interpretacao_aprofundado/
    - assets/content/portugues_ortografia/
    - assets/content/portugues_ortografia_aprofundado/
    - assets/content/portugues_pronomes/
    - assets/content/portugues_pronomes_aprofundado/
    - assets/content/portugues_subordinadas/
    - assets/content/portugues_subordinadas_aprofundado/
    - assets/content/portugues_termos/
    - assets/content/portugues_termos_aprofundado/
    - assets/content/portugues_verbos/
    - assets/content/portugues_verbos_aprofundado/
    - assets/fonts/OFL.txt
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
