<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Endereço base: trocado na compilação (--base-href). -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Taticum — planejamento de estudos para concursos policiais.">
  <meta name="theme-color" content="#0A1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taticum">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Taticum</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0A1220; }
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #E0B23A; font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .12em;
    }
    #carregando img { width: 96px; height: 96px; }
    #carregando .barra { width: 160px; height: 3px; background: #1B2638; overflow: hidden; border-radius: 2px; }
    #carregando .barra i { display: block; width: 40%; height: 100%; background: #E0B23A; animation: vai 1.1s ease-in-out infinite; }
    @keyframes vai { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="carregando">
    <img src="icons/Icon-192.png" alt="">
    <div>CARREGANDO O TATICUM</div>
    <div class="barra"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
