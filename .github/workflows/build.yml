# Gera as versões de teste para Windows e macOS a cada envio para o GitHub.
# Os instaladores ficam em: Actions › (execução) › Artifacts. Ao criar uma tag "v0.1.0", vira um Release.
name: Build Windows e macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  verificar:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Gerar a pasta windows/ e aplicar as personalizações
        shell: bash
        run: |
          flutter create --platforms=windows --org br.com.mentorpolicial --project-name mentor_policial .
          rm -f test/widget_test.dart
          cp -R platform/windows/. windows/
          sed -i 's/set(BINARY_NAME "mentor_policial")/set(BINARY_NAME "MentorPolicial")/' windows/CMakeLists.txt
      - run: flutter build windows --release
      - name: Incluir bibliotecas do Visual C++ (para PCs que não as têm)
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$dll" build/windows/x64/runner/Release/ -ErrorAction Stop
          }
      - name: Gerar o instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compactar a versão portátil
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MentorPolicial-windows-portatil.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MentorPolicial-windows
          path: |
            dist/MentorPolicial-Setup.exe
            MentorPolicial-windows-portatil.zip

  macos:
    name: macOS (Apple Silicon e Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Gerar a pasta macos/ e aplicar as personalizações
        run: |
          flutter create --platforms=macos --org br.com.mentorpolicial --project-name mentor_policial .
          rm -f test/widget_test.dart
          cp -R platform/macos/. macos/
      - run: flutter build macos --release
      - name: Gerar o .dmg
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Mentor Policial" -srcfolder dmg -ov -format UDZO MentorPolicial-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MentorPolicial-macos
          path: MentorPolicial-macOS.dmg

  release:
    name: Publicar versão (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/MentorPolicial-Setup.exe
            dist/**/MentorPolicial-windows-portatil.zip
            dist/**/MentorPolicial-macOS.dmg
          prerelease: false
          make_latest: true
          body: |
            ## Como instalar

            **Windows:** baixe `MentorPolicial-Setup.exe`, abra e clique em Avançar › Instalar. Se aparecer a tela azul "O Windows protegeu o computador", clique em **Mais informações** › **Executar assim mesmo**.

            **Mac:** baixe `MentorPolicial-macOS.dmg`, abra e arraste o Mentor Policial para Aplicativos. Na primeira vez, se o Mac bloquear: Ajustes do Sistema › Privacidade e Segurança › **Abrir Mesmo Assim**.

            Seus dados ficam salvos no computador e são mantidos nas atualizações.
