# Gera as versões de teste para Windows e macOS a cada envio para o GitHub.
# Os instaladores ficam em: Actions › (execução) › Artifacts. Ao criar uma tag "v0.1.0", vira um Release.
name: Build Windows e macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  verificar:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Conferir configuração das contas (sem mostrar os valores)
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          URL="$(echo "$URL" | xargs | sed -E 's#/+$##; s#/(rest|auth)/v1$##')"; KEY="$(echo "$KEY" | xargs)"
          if [ -z "$URL" ] && [ -z "$KEY" ]; then echo "Contas DESATIVADAS (variáveis não definidas)."; exit 0; fi
          [ -n "$URL" ] || { echo "::error::Falta a variável SUPABASE_URL"; exit 1; }
          [ -n "$KEY" ] || { echo "::error::Falta a variável SUPABASE_KEY"; exit 1; }
          echo "$URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co/?$' || { echo "::error::SUPABASE_URL deve ser https://<id>.supabase.co"; exit 1; }
          case "$KEY" in
            sb_secret_*) echo "::error::SUPABASE_KEY é a chave SECRETA. Apague-a do GitHub, gere outra no Supabase e use a Publishable."; exit 1;;
            sb_publishable_*) echo "Chave publishable: ok";;
            eyJ*)
              ROLE="$(echo "$KEY" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | grep -o '"role":"[a-z_]*"' || true)"
              [ "$ROLE" = '"role":"anon"' ] || { echo "::error::SUPABASE_KEY não é a chave anon/publishable ($ROLE)"; exit 1; }
              echo "Chave anon (legada): ok";;
            *) echo "::error::SUPABASE_KEY em formato desconhecido; use a Publishable key"; exit 1;;
          esac
          echo "Contas ATIVADAS: URL e chave em formato válido."
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Gerar a pasta windows/ e aplicar as personalizações
        shell: bash
        run: |
          flutter create --platforms=windows --org br.com.taticum --project-name mentor_policial .
          rm -f test/widget_test.dart
          cp -R platform/windows/. windows/
          sed -i 's/set(BINARY_NAME "mentor_policial")/set(BINARY_NAME "Taticum")/' windows/CMakeLists.txt
      - name: Compilar (contas ativadas se as variáveis SUPABASE_URL e SUPABASE_KEY existirem no repositório)
        shell: bash
        run: flutter build windows --release --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" --dart-define=SUPABASE_KEY="${{ vars.SUPABASE_KEY }}"
      - name: Incluir bibliotecas do Visual C++ (para PCs que não as têm)
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$dll" build/windows/x64/runner/Release/ -ErrorAction Stop
          }
      - name: Gerar o instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compactar a versão portátil
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Taticum-windows-portatil.zip
      - name: Gerar o pacote da Microsoft Store (MSIX, assinado pela própria Store no envio)
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)').Matches[0].Groups
          $version = "$($v[1].Value).$($v[2].Value).$($v[3].Value).0"   # a Store exige o 4º número = 0
          $stage = "msix-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* $stage
          Copy-Item -Recurse platform/windows/msix/Assets $stage/Assets
          (Get-Content platform/windows/msix/AppxManifest.xml -Raw).Replace('__VERSION__', $version) | Set-Content -Encoding utf8 "$stage/AppxManifest.xml"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe não encontrado" }
          & $makeappx.FullName pack /o /d $stage /p Taticum-Store.msix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "MSIX $version gerado"
      - uses: actions/upload-artifact@v4
        with:
          name: Taticum-windows
          path: |
            dist/Taticum-Setup.exe
            Taticum-windows-portatil.zip
            Taticum-Store.msix

  macos:
    name: macOS (Apple Silicon e Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Gerar a pasta macos/ e aplicar as personalizações
        run: |
          flutter create --platforms=macos --org br.com.taticum --project-name mentor_policial .
          rm -f test/widget_test.dart
          cp -R platform/macos/. macos/
      - name: Compilar (contas ativadas se as variáveis SUPABASE_URL e SUPABASE_KEY existirem no repositório)
        run: flutter build macos --release --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" --dart-define=SUPABASE_KEY="${{ vars.SUPABASE_KEY }}"
      - name: Gerar o .dmg
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Taticum" -srcfolder dmg -ov -format UDZO Taticum-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Taticum-macos
          path: Taticum-macOS.dmg

  web:
    name: Navegador (site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Gerar a pasta web/ e aplicar as personalizações
        run: |
          flutter create --platforms=web --org br.com.taticum --project-name mentor_policial .
          rm -f test/widget_test.dart
          cp -R platform/web/. web/
      - name: Compilar
        # Com domínio próprio (variável WEB_DOMAIN, ex.: app.taticum.com.br) o site fica na raiz;
        # sem ele, fica em https://cruzdelima.github.io/Mentor-Policial/.
        run: |
          if [ -n "${{ vars.WEB_DOMAIN }}" ]; then BASE="/"; else BASE="/${{ github.event.repository.name }}/"; fi
          flutter build web --release --base-href "$BASE" --no-web-resources-cdn \
            --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" --dart-define=SUPABASE_KEY="${{ vars.SUPABASE_KEY }}"
          if [ -n "${{ vars.WEB_DOMAIN }}" ]; then echo "${{ vars.WEB_DOMAIN }}" > build/web/CNAME; fi
          touch build/web/.nojekyll
          du -sh build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  site:
    # Publica o site a cada envio para main que passou nos testes.
    # Requer: Settings › Pages › Source = "GitHub Actions" (uma vez só).
    name: Publicar site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verificar, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    # Publica uma versão nova sempre que o número em pubspec.yaml mudar (e tudo tiver passado).
    name: Publicar versão
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verificar, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ler a versão
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9.]+).*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "A versão v$V já foi publicada; nada a fazer."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Organizar arquivos
        if: steps.v.outputs.new == 'true'
        run: |
          mkdir -p out
          find dist -name 'Taticum-Setup.exe' -exec cp {} out/ \;
          find dist -name 'Taticum-windows-portatil.zip' -exec cp {} out/ \;
          find dist -name 'Taticum-macOS.dmg' -exec cp {} out/ \;
          find dist -name 'Taticum-Store.msix' -exec cp {} out/ \;
          test -f out/Taticum-Setup.exe && test -f out/Taticum-macOS.dmg
          # Cópias com o nome antigo: o botão "Baixar atualização" das versões até 0.3.0 aponta para elas.
          cp out/Taticum-Setup.exe out/MentorPolicial-Setup.exe
          cp out/Taticum-macOS.dmg out/MentorPolicial-macOS.dmg
          ls -la out
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.new == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Taticum ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            ## Como instalar

            **Windows:** baixe `Taticum-Setup.exe`, abra e clique em **Instalar**. Se aparecer a tela azul "O Windows protegeu o computador", clique em **Mais informações** › **Executar assim mesmo**.

            **Mac:** baixe `Taticum-macOS.dmg`, abra e arraste o Taticum para **Aplicativos**. Na primeira vez: Ajustes do Sistema › Privacidade e Segurança › **Abrir Mesmo Assim**.

            Já tem o app? Instale por cima: seus dados continuam salvos.
